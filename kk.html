<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pick a Card</title>
<link rel="stylesheet" href="kk.css">
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="wrap">
    <h1>pick a card 🃏</h1>
    <p class="sub">hover each one, they don't all flip the same way</p>

    <div class="grid">
        <div class="card card-a">
            <div class="front"><span>☕</span></div>
            <div class="back"><span>coffee</span></div>
        </div>
        <div class="card card-b">
            <div class="front"><span>🌙</span></div>
            <div class="back"><span>sleep</span></div>
        </div>
        <div class="card card-c">
            <div class="front"><span>💻</span></div>
            <div class="back"><span>code</span></div>
        </div>
    </div>
</div>

</body>
</html>
